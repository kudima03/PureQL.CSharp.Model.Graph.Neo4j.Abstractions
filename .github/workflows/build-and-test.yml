name: .NET build & test

on:
  pull_request:
    branches: [ "main" ]

env:
  COVERAGE_WARNING_THRESHOLD: 99
  COVERAGE_THRESHOLD: 95
  MUTATION_THRESHOLD: 98

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore
    - name: Restore tools
      run: dotnet tool restore
    - name: Build
      run: dotnet build --no-restore -warnaserror
    - name: Code style check by dotnet format
      run: dotnet format --verify-no-changes
    - name: Code style check by csharpier
      run: dotnet csharpier check .
    - name: Test
      run: dotnet test --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage"
    # - name: Run mutation test
    #   run: dotnet stryker --mutation-level Complete --break-at ${{ env.MUTATION_THRESHOLD }}
